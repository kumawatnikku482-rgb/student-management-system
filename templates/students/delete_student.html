<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h2>Delete Student</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="/students/list/">Cancel</a>

</body>
</html>
